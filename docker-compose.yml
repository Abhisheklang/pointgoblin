services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pointgoblin
      POSTGRES_PASSWORD: pointgoblin
      POSTGRES_DB: pointgoblin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointgoblin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1: &api
    build: ./backend
    environment: &api_env
      DATABASE_URL: postgresql+psycopg://pointgoblin:pointgoblin@postgres:5432/pointgoblin
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS: redis
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api2:
    <<: *api
    environment: *api_env

  frontend:
    build: ./frontend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - frontend

volumes:
  postgres_data:
